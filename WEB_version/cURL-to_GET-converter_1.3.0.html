    <style>
        :root {
            --convert-bg:        #a3ffb5;
            --convert-hover:     #85e89a;
            --convert-active:    #63cc7a;
            --copy-bg:           #f0f2af;
            --copy-hover:        #d8da8e;
            --copy-active:       #c0c270;
            --send-bg:           #b5d4ff;
            --send-hover:        #9ec0ed;
            --send-active:       #7fa6d4;
            --resp-bg:           #f5b8c8;
            --resp-hover:        #e09cae;
            --resp-active:       #c78294;
            --border:            #c8c8c8;
            --border-focus:      #7a7a7a;
            --text:              #1f1f1f;
            --bg:                #f3f3f3;
            --card-bg:           #ffffff;
            --shadow:            0 2px 8px rgba(0, 0, 0, 0.08);
            --error-bg:          #ffe1e1;
            --error-border:      #d04040;
            --error-text:        #8b0000;
            --toast-bg:          #323232;
            --guide-color:       #e4e4e4;
            --anim-duration:     0.1s;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 16px;
            box-sizing: border-box;
        }

        .app {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
            transition: max-width var(--anim-duration) linear;
        }

        .app.expanded { max-width: 1320px; }

        .columns {
            display: grid;
            grid-template-columns: 1fr 0fr;
            gap: 0;
            flex: 1 1 0;
            min-height: 0;
            transition: grid-template-columns var(--anim-duration) linear, gap var(--anim-duration) linear;
            width: 100%;
            min-width: 0;
        }

        .app.expanded .columns {
            grid-template-columns: 1fr 2fr;
            gap: 16px;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
            min-height: 0;
        }

        .right-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            overflow: hidden;
            min-width: 0;
            min-height: 0;
            opacity: 0;
            transition: opacity var(--anim-duration) linear;
        }

        .app.expanded .right-panel { opacity: 1; }

        .request-editor, .response-viewer {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
            min-height: 0;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title {
            font-size: 18px;
            font-weight: 500;
            margin: 0;
        }

        .info-icon {
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #5b9bff;
            color: white;
            font-weight: bold;
            font-size: 13px;
            user-select: none;
            transition: background 0.15s;
        }

        .info-icon:hover {
            background: #3a7fe0;
        }

        .info-icon img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
        }

        textarea, input[type="text"] {
            width: 100%;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            line-height: 1.4;
            background: #fdfdfd;
            transition: border-color 0.15s;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--border-focus);
        }

        textarea[readonly] {
            background: #f7f7f7;
            color: #333;
        }

        /* Both textareas grow equally (1:1) to fill the left column height.
           Internal vertical scroll appears when content exceeds visible height
           (textarea has overflow-y: auto by default). */
        #input-box  { flex: 1 1 0; min-height: 80px; resize: none; }
        #output-box { flex: 1 1 0; min-height: 80px; resize: none; }

        /* Request URL — looks like a single-line input. Double-click expands. */
        #request-url-input {
            height: 38px;
            min-height: 38px;
            max-height: 38px;
            resize: none;
            overflow: hidden;
            line-height: 1.4;
            transition: max-height 0.1s linear;
        }

        #request-url-input.expanded {
            height: auto;          /* JS sets explicit pixel height */
            min-height: 38px;
            max-height: 240px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .section-label {
            font-size: 18px;
            font-weight: 500;
            margin: 4px 0 0 0;
        }

        button {
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.05s;
        }

        button:active { transform: translateY(1px); }

        #convert-btn { background: var(--convert-bg); }
        #convert-btn:hover { background: var(--convert-hover); }
        #convert-btn:active { background: var(--convert-active); }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        #copy-btn { background: var(--copy-bg); }
        #copy-btn:hover { background: var(--copy-hover); }
        #copy-btn:active { background: var(--copy-active); }

        #send-btn { background: var(--send-bg); }
        #send-btn:hover { background: var(--send-hover); }
        #send-btn:active { background: var(--send-active); }

        #copy-response-btn { background: var(--resp-bg); }
        #copy-response-btn:hover { background: var(--resp-hover); }
        #copy-response-btn:active { background: var(--resp-active); }

        /* Status row — three fields side-by-side: status code, time, size */
        .status-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        #status-code, #status-time, #status-size {
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #444;
            outline: none;
            cursor: text;
            width: auto;
            flex: 0 0 auto;
            transition: background 0.2s linear;
        }

        /* Only the status-code field gets the colored background; time/size stay neutral */
        #status-code.s2xx { background: #c8f0c8; color: black; }
        #status-code.s3xx { background: #c8d8f0; color: black; }
        #status-code.s4xx { background: #ffe0b0; color: black; }
        #status-code.s5xx { background: #ffc0c0; color: black; }
        #status-code.s-err { background: transparent; color: #8b0000; }

        /* Response box — JSON style: no wrap, internal vertical+horizontal scroll.
           min-height: 0 is critical so the content doesn't push the page taller. */
        .response-box {
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.4;
            padding: 10px 12px;
            margin: 0;
            background-color: #fdfdfd;
            border: 1px solid var(--border);
            border-radius: 6px;
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre;
            user-select: text;
        }

        /* Params table — internal vertical scroll, no max-height
           (table doesn't push the page; scroll appears inside the wrap when needed) */
        .params-table-wrap {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fdfdfd;
        }

        .params-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
        }

        .params-table thead {
            position: sticky;
            top: 0;
            background: #f5f5f5;
            z-index: 1;
        }

        .params-table th, .params-table td {
            border: 1px solid #e0e0e0;
            padding: 4px 8px;
            text-align: left;
            vertical-align: top;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
        }

        .params-table th { font-weight: 600; }

        .params-table td.key-cell {
            background: #fafafa;
            word-break: break-all;
            user-select: none;
            cursor: default;
        }

        .params-table td.value-cell {
            height: 28px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
            cursor: default;
        }

        /* Single-click selected cell — subtle grey (no blue, no bold header) */
        .params-table td.selected {
            background-color: #e8e8e8 !important;
            color: black;
        }

        /* Double-clicked row: value cell expands, wraps even unbreakable strings */
        .params-table tr.expanded td.value-cell {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            overflow: visible;
            height: auto;
        }

        /* While being edited — show subtle grey outline, white bg */
        .params-table td[contenteditable="true"] {
            user-select: text;
            cursor: text;
            background: #fff !important;
        }
        .params-table td[contenteditable="true"]:focus {
            outline: 2px solid #888;
            outline-offset: -2px;
        }

        /* Request type indicator — method + content-type chips (selectable) */
        .indicator-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .indicator {
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            padding: 2px 8px;
            border-radius: 4px;
            user-select: text;
        }

        .indicator.method-get       { background: #C8F0C8; }
        .indicator.method-post      { background: #D8DA8E; }
        .indicator.ctype-json       { background: #B5D4FF; }
        .indicator.ctype-get-other  { background: #DEF6DE; }
        .indicator.ctype-post-other { background: #E8E9BB; }

        /* JSON / raw request body — text editor shown instead of the params table */
        .json-editor {
            flex: 1 1 0;
            min-height: 0;
            resize: none;
            white-space: pre;
            overflow: auto;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fdfdfd;
        }

        /* GIF overlay (instructions) */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            padding: 20px;
        }

        .overlay img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 6px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        }

        .overlay .fallback {
            background: white;
            padding: 24px 28px;
            border-radius: 8px;
            max-width: 520px;
            line-height: 1.5;
        }

        .overlay .fallback h3 {
            margin: 0 0 12px 0;
            font-size: 18px;
        }

        .overlay .fallback ol {
            padding-left: 22px;
            margin: 0;
        }

        .overlay .fallback li {
            margin: 4px 0;
        }

        /* Error message */
        .error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 10px 14px;
            border-radius: 6px;
            text-align: center;
            white-space: pre-line;
            font-size: 14px;
        }

        /* Copy toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--toast-bg);
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 1100;
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        .footer {
            font-size: 11px;
            color: #888;
            text-align: right;
            margin-top: 4px;
        }

        .hidden {
            display: none !important;
        }

        /* Adaptive layout — mobile */
        @media (max-width: 540px) {
            body {
                padding: 8px;
            }

            .app {
                padding: 14px 14px;
                border-radius: 8px;
            }

            .title {
                font-size: 16px;
            }

            .section-label {
                font-size: 16px;
            }

            button {
                font-size: 13px;
                padding: 12px 14px;
            }

            textarea {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<main class="app" id="app">

    <div class="columns" id="columns">

        <!-- LEFT COLUMN -->
        <div class="left-column">

            <div class="title-row">
                <h1 class="title">Paste cURL (bash) type from DevTools</h1>
                <span id="info-icon" class="info-icon" title="Click it to see instructions">
                    <img src="resources/info.png" alt="info" onerror="this.outerHTML='i'">
                </span>
            </div>

            <textarea id="input-box" placeholder="Paste cURL (bash) type here..." spellcheck="false"></textarea>

            <button id="convert-btn">Convert from cURL (bash) type to request</button>

            <div id="error-box" class="error hidden"></div>

            <h2 class="section-label">Converted URL</h2>

            <textarea id="output-box" placeholder="Converted URL will appear here. You can edit it manually." spellcheck="false"></textarea>

            <div class="btn-row">
                <button id="copy-btn">Copy request</button>
                <button id="send-btn">Send request</button>
            </div>

        </div>

        <!-- RIGHT PANEL — slides in when Send is clicked -->
        <div class="right-panel" id="right-panel">

            <div class="request-editor">
                <h2 class="section-label">Request</h2>
                <div class="indicator-row" id="indicator-row">
                    <span id="method-indicator" class="indicator hidden"></span>
                    <span id="ctype-indicator" class="indicator hidden"></span>
                </div>
                <textarea id="request-url-input" rows="1" wrap="off" placeholder="Base URL up to '?'  (double-click to expand)" spellcheck="false"></textarea>

                <h2 class="section-label">Requests params</h2>
                <div class="params-table-wrap" id="params-table-wrap">
                    <table class="params-table">
                        <colgroup>
                            <col id="key-col">
                            <col id="value-col">
                        </colgroup>
                        <thead>
                            <tr><th>Key</th><th>Value</th></tr>
                        </thead>
                        <tbody id="params-tbody"></tbody>
                    </table>
                </div>
                <textarea id="json-editor" class="json-editor hidden" wrap="off" spellcheck="false" placeholder="Request body (JSON / raw) — editable."></textarea>
            </div>

            <div class="response-viewer">
                <h2 class="section-label">Response</h2>
                <div class="status-row">
                    <input id="status-code" type="text" readonly value="">
                    <input id="status-time" type="text" readonly value="">
                    <input id="status-size" type="text" readonly value="">
                </div>
                <pre id="response-box" class="response-box"></pre>
                <button id="copy-response-btn">Copy response</button>
            </div>

        </div>

    </div>

    <div class="footer">v1.3.0 &middot; web edition</div>

</main>

<div id="toast" class="toast">Copied to clipboard</div>

<script>
    // ============================================================
    // Parsing helpers (port of desktop main.py)
    // ============================================================
    function parseMultipart(body) {
        // Parses multipart/form-data: name="key"\r\n\r\nvalue\r\n
        // (where \r\n are the literal 4-char escape sequences from bash $'...')
        const re = /name="([^"]+)"\\r\\n\\r\\n([\s\S]*?)\\r\\n/g;
        const params = {};
        let m;
        while ((m = re.exec(body)) !== null) {
            params[m[1]] = m[2].trim();
        }
        return params;
    }

    function parseUrlEncoded(body) {
        // Parses application/x-www-form-urlencoded: a=1&b=2
        const params = {};
        for (const [k, v] of new URLSearchParams(body)) {
            params[k] = v;
        }
        return params;
    }

    function parseBody(body) {
        // Auto-detect: try multipart first, fall back to URL-encoded
        const params = parseMultipart(body);
        if (Object.keys(params).length > 0) return params;
        return parseUrlEncoded(body);
    }

    // cURL body options, more specific ones first
    const BODY_OPTS = ['--data-raw', '--data-binary', '--data-ascii',
                       '--data-urlencode', '--data', '-d'];

    function escapeRegex(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function extractBody(text) {
        // Pull the request body out of a cURL command ($'...' or '...').
        for (const opt of BODY_OPTS) {
            const esc = escapeRegex(opt);
            let m = text.match(new RegExp(esc + " \\$'([\\s\\S]*?)'"));
            if (m) return m[1];
            m = text.match(new RegExp(esc + " '([\\s\\S]*?)'"));
            if (m) return m[1];
        }
        return null;
    }

    function extractContentType(text) {
        // Clean MIME type (boundary / charset parameters stripped).
        const m = text.match(/-H '[Cc]ontent-[Tt]ype:\s*([^']+)'/);
        if (!m) return '';
        return m[1].split(';')[0].trim();
    }

    function detectRequest(text) {
        // Analyse a copied cURL (bash) command. Returns an object:
        // { method, contentType, bodyFormat, baseUrl, params, bodyText }
        text = text.trim();
        const urlMatch = text.match(/curl '([^']+)'/);
        if (!urlMatch) {
            throw new Error("It's not cURL (bash) type URL.\nPaste cURL (bash) type URL from DevTools please.");
        }
        const baseUrl = urlMatch[1];
        const contentType = extractContentType(text);
        const body = extractBody(text);

        // --- method ---
        let method = body !== null ? 'POST' : 'GET';
        if (/(-X|--request)\s+'?POST'?/.test(text)) method = 'POST';
        if (body === null && /(-X|--request)\s+'?GET'?/.test(text)) method = 'GET';

        // --- body format ---
        const ctLow = contentType.toLowerCase();
        let bodyFormat;
        if (body === null) {
            bodyFormat = 'none';
        } else if (ctLow.includes('json')) {
            bodyFormat = 'json';
        } else if (ctLow.includes('multipart')) {
            bodyFormat = 'multipart';
        } else if (ctLow.includes('x-www-form-urlencoded')) {
            bodyFormat = 'url-encoded';
        } else {
            // No (or unhelpful) Content-Type: guess from the body shape
            const stripped = body.replace(/^\s+/, '');
            if (stripped[0] === '{' || stripped[0] === '[') {
                bodyFormat = 'json';
            } else if (body.includes('name="') && (body.includes('\\r\\n') || body.includes('------'))) {
                bodyFormat = 'multipart';
            } else if (/^[^=&\s]+=/.test(body)) {
                bodyFormat = 'url-encoded';
            } else {
                bodyFormat = 'binary';
            }
        }

        // --- params / body text ---
        let params = {};
        let bodyText = '';
        if (bodyFormat === 'url-encoded') {
            params = parseUrlEncoded(body);
        } else if (bodyFormat === 'multipart') {
            params = parseMultipart(body);
            if (Object.keys(params).length === 0) {
                bodyFormat = 'binary';
                bodyText = body;
            }
        } else if (bodyFormat === 'json' || bodyFormat === 'binary') {
            bodyText = body;
        }

        return { method, contentType, bodyFormat, baseUrl, params, bodyText };
    }

    function buildConvertedUrl(pr) {
        // Form bodies append params as a query string (keeps the triangle sync
        // working); json/binary bodies are not part of the URL.
        if (pr.bodyFormat === 'json' || pr.bodyFormat === 'binary'
            || Object.keys(pr.params).length === 0) {
            return pr.baseUrl;
        }
        const separator = pr.baseUrl.includes('?') ? '&' : '?';
        return pr.baseUrl + separator + new URLSearchParams(pr.params).toString();
    }

    function prettyJson(text) {
        try {
            return JSON.stringify(JSON.parse(text), null, 4);
        } catch (_) {
            return text;
        }
    }

    function splitUrl(url) {
        url = url.trim();
        const qIdx = url.indexOf('?');
        if (qIdx >= 0) {
            const base = url.substring(0, qIdx);
            const query = url.substring(qIdx + 1);
            const params = {};
            for (const [k, v] of new URLSearchParams(query)) {
                params[k] = v;
            }
            return { base: base + '?', params };
        }
        return { base: url, params: {} };
    }

    function buildUrl(base, params) {
        base = base.replace(/\?+$/, '');
        const keys = Object.keys(params);
        if (keys.length === 0) return base;
        const query = new URLSearchParams(params).toString();
        return base + '?' + query;
    }

    // ============================================================
    // DOM refs
    // ============================================================
    const app              = document.getElementById('app');
    const inputBox         = document.getElementById('input-box');
    const outputBox        = document.getElementById('output-box');
    const convertBtn       = document.getElementById('convert-btn');
    const copyBtn          = document.getElementById('copy-btn');
    const sendBtn          = document.getElementById('send-btn');
    const infoIcon         = document.getElementById('info-icon');
    const errorBox         = document.getElementById('error-box');
    const toast            = document.getElementById('toast');
    const requestUrlInput  = document.getElementById('request-url-input');
    const paramsTbody      = document.getElementById('params-tbody');
    const keyCol           = document.getElementById('key-col');
    const valueCol         = document.getElementById('value-col');
    const statusCode       = document.getElementById('status-code');
    const statusTime       = document.getElementById('status-time');
    const statusSize       = document.getElementById('status-size');
    const responseBox      = document.getElementById('response-box');
    const copyResponseBtn  = document.getElementById('copy-response-btn');
    const methodIndicator  = document.getElementById('method-indicator');
    const ctypeIndicator   = document.getElementById('ctype-indicator');
    const jsonEditor       = document.getElementById('json-editor');
    const paramsTableWrap  = document.getElementById('params-table-wrap');

    // Sync guard flag — prevents triangle infinite loops
    let _syncing = false;
    let _expandedRow = null;
    let _selectedCell = null;

    // Last detectRequest() result — drives Send + the type indicator
    let _parsed = null;
    // True when the body is shown as a JSON/raw text editor instead of the table
    let _jsonMode = false;

    // ============================================================
    // Error / toast / clipboard helpers
    // ============================================================
    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove('hidden');
    }

    function clearError() {
        errorBox.classList.add('hidden');
        errorBox.textContent = '';
    }

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => toast.classList.remove('visible'), 1500);
    }

    async function copyToClipboard(text) {
        try {
            await navigator.clipboard.writeText(text);
        } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch (_) {}
            document.body.removeChild(ta);
        }
    }

    // ============================================================
    // Params table
    // ============================================================
    function fillParamsTable(params) {
        paramsTbody.innerHTML = '';
        _expandedRow = null;
        _selectedCell = null;
        for (const [key, value] of Object.entries(params)) {
            const tr = document.createElement('tr');

            const keyTd = document.createElement('td');
            keyTd.className = 'key-cell';
            keyTd.textContent = key;
            attachCellHandlers(keyTd, tr);
            tr.appendChild(keyTd);

            const valTd = document.createElement('td');
            valTd.className = 'value-cell';
            valTd.textContent = value;
            attachCellHandlers(valTd, tr);
            tr.appendChild(valTd);

            paramsTbody.appendChild(tr);
        }
        adjustKeyColumnWidth();
    }

    function attachCellHandlers(cell, tr) {
        // Single click: select the cell (subtle grey). No size change, no edit.
        cell.addEventListener('click', () => {
            if (cell.getAttribute('contenteditable') === 'true') return;
            selectCell(cell);
        });

        // Double click: expand row + start editing (multi-line, wrap anywhere)
        cell.addEventListener('dblclick', () => {
            // Collapse a different row if one was expanded
            if (_expandedRow && _expandedRow !== tr) collapseExpandedRow();
            tr.classList.add('expanded');
            _expandedRow = tr;
            cell.setAttribute('contenteditable', 'true');
            cell.focus();
            placeCaretAtEnd(cell);
        });

        // Live sync while editing
        cell.addEventListener('input', () => {
            if (cell.getAttribute('contenteditable') === 'true') onParamsEdited();
        });

        // Commit edit on blur, collapse row back
        cell.addEventListener('blur', () => {
            if (cell.getAttribute('contenteditable') !== 'true') return;
            cell.removeAttribute('contenteditable');
            if (_expandedRow === tr) {
                tr.classList.remove('expanded');
                _expandedRow = null;
            }
        });

        // Enter commits (no newline), Esc cancels (just blurs — input was synced live)
        cell.addEventListener('keydown', (e) => {
            if (cell.getAttribute('contenteditable') !== 'true') return;
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                cell.blur();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                cell.blur();
            }
        });

        // Strip any rich-text formatting when pasting into the editable cell
        cell.addEventListener('paste', (e) => {
            if (cell.getAttribute('contenteditable') !== 'true') return;
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, text);
        });
    }

    function selectCell(cell) {
        if (_selectedCell && _selectedCell !== cell) {
            _selectedCell.classList.remove('selected');
        }
        cell.classList.add('selected');
        _selectedCell = cell;
    }

    function deselectCell() {
        if (_selectedCell) {
            _selectedCell.classList.remove('selected');
            _selectedCell = null;
        }
    }

    function collapseExpandedRow() {
        if (!_expandedRow) return;
        for (const c of _expandedRow.children) {
            c.removeAttribute('contenteditable');
        }
        _expandedRow.classList.remove('expanded');
        _expandedRow = null;
    }

    function placeCaretAtEnd(el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
    }

    function readParamsTable() {
        const params = {};
        for (const tr of paramsTbody.children) {
            const keyTd = tr.children[0];
            const valTd = tr.children[1];
            const key = keyTd.textContent.trim();
            if (!key) continue;
            params[key] = valTd.textContent;
        }
        return params;
    }

    function adjustKeyColumnWidth() {
        const rows = paramsTbody.children;
        if (rows.length === 0) {
            keyCol.style.width = '80px';
            return;
        }
        const tableWidth = paramsTbody.parentElement.clientWidth;
        // Bail out if the table isn't visible yet (e.g., right panel still
        // collapsed). The ResizeObserver below will call us again when the
        // wrap actually has a non-zero width.
        if (tableWidth <= 0) return;

        // Measure longest key text in pixels
        const probe = document.createElement('span');
        probe.style.cssText = 'visibility:hidden;position:absolute;white-space:pre;font-family:Consolas,monospace;font-size:13px;';
        document.body.appendChild(probe);
        let maxW = 0;
        try {
            for (const tr of rows) {
                probe.textContent = tr.children[0].textContent;
                if (probe.offsetWidth > maxW) maxW = probe.offsetWidth;
            }
        } finally {
            document.body.removeChild(probe);
        }
        maxW += 24; // padding
        const cap = Math.floor(tableWidth / 2);
        keyCol.style.width = Math.min(maxW, cap) + 'px';
    }

    // Observe the table-wrap size: when the right panel opens (0 → real width)
    // we re-compute the key column width. This avoids the "broken first paint"
    // race where the params table got populated while the wrap was still 0px.
    if (window.ResizeObserver) {
        const _tableWrap = paramsTbody.parentElement;
        new ResizeObserver(() => adjustKeyColumnWidth()).observe(_tableWrap);
    }

    function onParamsEdited() {
        if (_syncing) return;
        _syncing = true;
        try {
            const base = requestUrlInput.value;
            const params = readParamsTable();
            outputBox.value = buildUrl(base, params);
        } finally {
            _syncing = false;
        }
    }

    // Click outside the table — deselect cell. Don't collapse expanded row here:
    // edit-mode blur handler does that naturally when the editable cell loses focus.
    document.addEventListener('click', (e) => {
        if (!paramsTbody.parentElement.contains(e.target)) {
            deselectCell();
        }
    });

    // Ctrl+C / Ctrl+X / Ctrl+V on a selected (non-editing) cell — acts on the cell's value.
    // When the cell IS in edit mode, browser's default Ctrl handlers apply to the text inside.
    document.addEventListener('keydown', async (e) => {
        if (!_selectedCell) return;
        if (_selectedCell.getAttribute('contenteditable') === 'true') return;
        if (!e.ctrlKey || e.shiftKey || e.altKey || e.metaKey) return;

        const key = (e.key || '').toLowerCase();
        if (key === 'c') {
            e.preventDefault();
            try { await navigator.clipboard.writeText(_selectedCell.textContent); } catch (_) {}
            showToast('Cell copied');
        } else if (key === 'x') {
            e.preventDefault();
            try { await navigator.clipboard.writeText(_selectedCell.textContent); } catch (_) {}
            _selectedCell.textContent = '';
            onParamsEdited();
        } else if (key === 'v') {
            e.preventDefault();
            try {
                const text = await navigator.clipboard.readText();
                _selectedCell.textContent = text;
                onParamsEdited();
            } catch (_) {}
        }
    });

    // Recalculate key column width on window resize (debounced)
    let _resizeTimer = null;
    window.addEventListener('resize', () => {
        clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(adjustKeyColumnWidth, 100);
    });

    // ============================================================
    // Triangle sync: Converted URL ⇄ Request URL ⇄ Params Table
    // ============================================================
    outputBox.addEventListener('input', () => {
        if (_syncing) return;
        _syncing = true;
        try {
            const url = outputBox.value.trim();
            const { base, params } = splitUrl(url);
            requestUrlInput.value = base;
            fillParamsTable(params);
        } finally {
            _syncing = false;
        }
    });

    requestUrlInput.addEventListener('input', () => {
        if (_syncing) return;
        _syncing = true;
        try {
            const base = requestUrlInput.value;
            const params = readParamsTable();
            outputBox.value = buildUrl(base, params);
        } finally {
            _syncing = false;
        }
    });

    // ============================================================
    // Request URL — expand on double-click, collapse on blur
    // ============================================================
    function expandRequestUrl() {
        // Switch the textarea into wrapping mode and grow it to fit content
        requestUrlInput.classList.add('expanded');
        requestUrlInput.setAttribute('wrap', 'soft');
        // Reset height to recalc from content
        requestUrlInput.style.height = 'auto';
        const h = Math.min(requestUrlInput.scrollHeight + 2, 240);
        requestUrlInput.style.height = h + 'px';
    }

    function collapseRequestUrl() {
        requestUrlInput.classList.remove('expanded');
        requestUrlInput.setAttribute('wrap', 'off');
        requestUrlInput.style.height = '';
    }

    requestUrlInput.addEventListener('dblclick', expandRequestUrl);
    requestUrlInput.addEventListener('blur', collapseRequestUrl);

    // Enter/Esc commit and collapse; Shift+Enter is reserved for newline
    // (rare for a URL but safe to allow during edit).
    requestUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            requestUrlInput.blur();
        } else if (e.key === 'Escape') {
            e.preventDefault();
            requestUrlInput.blur();
        }
    });

    // ============================================================
    // Request type indicator + body-editor mode
    // ============================================================
    function setJsonMode(on) {
        // Toggle the body editor between the key/value table and the JSON editor.
        _jsonMode = on;
        paramsTableWrap.classList.toggle('hidden', on);
        jsonEditor.classList.toggle('hidden', !on);
    }

    function updateIndicator() {
        // Refresh the method / content-type chips from _parsed.
        const pr = _parsed;
        if (!pr) {
            methodIndicator.classList.add('hidden');
            ctypeIndicator.classList.add('hidden');
            return;
        }
        // method — GET green / POST yellow
        methodIndicator.textContent = pr.method;
        methodIndicator.className = 'indicator '
            + (pr.method === 'POST' ? 'method-post' : 'method-get');
        // content-type — only if present in the request
        if (pr.contentType) {
            ctypeIndicator.textContent = pr.contentType;
            let cls;
            if (pr.contentType.toLowerCase().includes('json')) cls = 'ctype-json';
            else if (pr.method === 'POST') cls = 'ctype-post-other';
            else cls = 'ctype-get-other';
            ctypeIndicator.className = 'indicator ' + cls;
        } else {
            ctypeIndicator.classList.add('hidden');
        }
    }

    // ============================================================
    // Convert button
    // ============================================================
    convertBtn.addEventListener('click', () => {
        clearError();
        let pr;
        try {
            pr = detectRequest(inputBox.value);
        } catch (err) {
            _parsed = null;
            updateIndicator();
            outputBox.value = '';
            // Programmatic `.value = ...` does NOT trigger an `input` event,
            // so the triangle sync wouldn't fire. Dispatch it manually.
            outputBox.dispatchEvent(new Event('input', { bubbles: true }));
            showError(err.message);
            return;
        }

        _parsed = pr;

        if (pr.bodyFormat === 'json' || pr.bodyFormat === 'binary') {
            // JSON / raw body — text editor; body is not part of the URL
            setJsonMode(true);
            jsonEditor.value = prettyJson(pr.bodyText);
        } else {
            // GET or form-style body — key/value table; params live in the URL
            setJsonMode(false);
            jsonEditor.value = '';
        }
        outputBox.value = buildConvertedUrl(pr);
        outputBox.dispatchEvent(new Event('input', { bubbles: true }));
        updateIndicator();

        // If right panel is open, collapse it and clear stale response
        if (app.classList.contains('expanded')) {
            statusCode.value = '';
            statusCode.className = '';
            setStatusField(statusTime, '');
            setStatusField(statusSize, '');
            responseBox.textContent = '';
            app.classList.remove('expanded');
        }
    });

    // ============================================================
    // Copy buttons
    // ============================================================
    copyBtn.addEventListener('click', async () => {
        if (!outputBox.value) return;
        await copyToClipboard(outputBox.value);
        showToast('Copied to clipboard');
    });

    copyResponseBtn.addEventListener('click', async () => {
        if (!responseBox.textContent) return;
        await copyToClipboard(responseBox.textContent);
        showToast('Response copied');
    });

    // ============================================================
    // Send button (fetch + display response)
    // ============================================================
    // Helpers for the status-row fields (auto-size the input width to its content)
    function setStatusField(input, text) {
        input.value = text;
        // `size` is in approximate characters; for our monospace font this fits well.
        input.size = Math.max(1, text.length);
    }

    function formatTime(ms) {
        if (ms >= 1000) return `Time: ${(ms / 1000).toFixed(2)} s`;
        return `Time: ${Math.round(ms)} ms`;
    }

    function formatSize(bytes) {
        if (bytes >= 1024 * 1024) return `Size: ${(bytes / 1024 / 1024).toFixed(2)} MB`;
        if (bytes >= 1024)        return `Size: ${(bytes / 1024).toFixed(2)} KB`;
        return `Size: ${bytes} B`;
    }

    sendBtn.addEventListener('click', async () => {
        // Decide method / body from the last Convert (_parsed).
        const pr = _parsed;
        let url, fetchOpts;

        if (pr && pr.method === 'POST') {
            const base = requestUrlInput.value.trim().replace(/\?+$/, '');
            if (_jsonMode) {
                // JSON / raw — body comes straight from the text editor
                url = outputBox.value.trim();
                fetchOpts = {
                    method: 'POST',
                    body: jsonEditor.value,
                    headers: { 'Content-Type': pr.contentType || 'application/json' },
                };
            } else if (pr.bodyFormat === 'multipart') {
                // FormData — the browser sets the multipart boundary itself
                url = base;
                const fd = new FormData();
                for (const [k, v] of Object.entries(readParamsTable())) fd.append(k, v);
                fetchOpts = { method: 'POST', body: fd };
            } else {
                // url-encoded form body
                url = base;
                fetchOpts = {
                    method: 'POST',
                    body: new URLSearchParams(readParamsTable()).toString(),
                    headers: { 'Content-Type': pr.contentType || 'application/x-www-form-urlencoded' },
                };
            }
        } else {
            // GET (detected, or no Convert performed yet)
            url = outputBox.value.trim();
            fetchOpts = { method: 'GET' };
        }

        if (!url) {
            showError('Converted URL is empty. Paste cURL and click Convert first.');
            return;
        }
        clearError();

        // Open right panel (CSS animates the expand). ResizeObserver on the
        // table-wrap will recompute key column width automatically.
        if (!app.classList.contains('expanded')) {
            app.classList.add('expanded');
        }

        // Pending state — clear status fields
        setStatusField(statusCode, 'Sending...');
        statusCode.className = '';
        setStatusField(statusTime, '');
        setStatusField(statusSize, '');
        responseBox.textContent = '';

        const t0 = performance.now();
        try {
            const resp = await fetch(url, fetchOpts);
            const text = await resp.text();
            const elapsedMs = performance.now() - t0;
            const sizeBytes = new Blob([text]).size;

            setStatusField(statusCode, `Status code: ${resp.status} ${resp.statusText}`.trim());
            setStatusField(statusTime, formatTime(elapsedMs));
            setStatusField(statusSize, formatSize(sizeBytes));

            // Color by status class (only the status-code field; time/size stay neutral)
            const cls = Math.floor(resp.status / 100);
            statusCode.className = '';
            if (cls === 2) statusCode.classList.add('s2xx');
            else if (cls === 3) statusCode.classList.add('s3xx');
            else if (cls === 4) statusCode.classList.add('s4xx');
            else if (cls === 5) statusCode.classList.add('s5xx');

            // Pretty-print JSON if possible (4-space indent)
            let display = text;
            try {
                const parsed = JSON.parse(text);
                display = JSON.stringify(parsed, null, 4);
            } catch (_) { /* leave as plain text */ }
            responseBox.textContent = display;
        } catch (err) {
            const elapsedMs = performance.now() - t0;
            setStatusField(statusCode, `Network Error: ${err.message}`);
            statusCode.className = 's-err';
            setStatusField(statusTime, formatTime(elapsedMs));
            setStatusField(statusSize, '');
            responseBox.textContent = '';
        }
    });

    // ============================================================
    // Info icon — overlay with GIF (or fallback)
    // ============================================================
    infoIcon.addEventListener('click', () => {
        const overlay = document.createElement('div');
        overlay.className = 'overlay';

        const img = document.createElement('img');
        img.alt = 'instructions';
        img.src = 'resources/info.gif';

        img.onerror = () => {
            overlay.innerHTML = `
                <div class="fallback">
                    <h3>How to copy a request as cURL (bash)</h3>
                    <ol>
                        <li>Open browser DevTools (F12)</li>
                        <li>Go to the <b>Network</b> tab</li>
                        <li>Perform the action you want to capture</li>
                        <li>Right-click the request in the list</li>
                        <li>Choose <b>Copy &rarr; Copy as cURL (bash)</b></li>
                        <li>Paste it into the input field above</li>
                    </ol>
                    <p style="margin: 14px 0 0 0; color: #666; font-size: 13px;">
                        Click anywhere to close.
                    </p>
                </div>
            `;
        };

        overlay.appendChild(img);
        overlay.addEventListener('click', () => overlay.remove());
        document.body.appendChild(overlay);
    });

    // Convenience: Ctrl/Cmd+Enter to convert
    inputBox.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            convertBtn.click();
        }
    });
</script>

</body>
</html>
